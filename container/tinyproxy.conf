Port 8888
Listen 0.0.0.0
Timeout 86400
MaxClients 128
LogLevel Warning
# Foreground logging uses the inherited stdout descriptor. The supervisor
# redirects it to stderr without reopening a root-owned pipe after setpriv.
PidFile "/run/vpncsocks/proxy/tinyproxy.pid"
# Omitting ConnectPort permits CONNECT to SSH and other TCP ports.
# Host exposure is restricted by the Podman loopback-only port mappings.
